name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Trace SW release detail chunk payloads
        run: |
          python - <<'PY'
          import re, requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.swsresearch.com/','Accept':'text/html,application/javascript,text/plain,*/*'})
          base='https://www.swsresearch.com/institute_sw/'
          umi=S.get(base+'umi.js',timeout=40,verify=False).text
          print('UMI_LEN',len(umi))
          chunk_map={}
          m=re.search(r'\{0:"vendors.*?\}',umi)
          if m:
              raw=m.group(0)
              for k,v in re.findall(r'(\d+):"([^"]+)"',raw):
                  chunk_map[int(k)]=v
          print('CHUNK_COUNT',len(chunk_map))
          for k,v in sorted(chunk_map.items()):
              if 'releaseDetail' in v or 'releasedIndex' in v or k in [20,21,17,18,19]:
                  print('CHUNK',k,v)
          targets=[(k,v) for k,v in sorted(chunk_map.items()) if ('releaseDetail' in v or 'releasedIndex' in v or k in [20,21,17,18,19])]
          exts=['.async.js','.js']
          terms=['detailStocks','RELEASEDINDEX/detailStocks','component_stocks','swindexcode','indexCode','index_code','indexid','indexId','payload','dispatch','page_size','pageSize','detailAnnounce','detailTrend','detailTimelines']
          for k,name in targets:
              print('\n## FETCH_CHUNK',k,name)
              text=None; got=None
              for ext in exts:
                  url=base+name+ext
                  try:
                      r=S.get(url,timeout=40,verify=False)
                      print('TRY',url,'status',r.status_code,'len',len(r.text),'ctype',r.headers.get('content-type'))
                      if r.status_code==200 and len(r.text)>500:
                          text=r.text; got=url; break
                  except Exception as e:
                      print('TRY_ERROR',url,type(e).__name__,repr(e))
              if not text:
                  continue
              print('GOT',got,'LEN',len(text))
              found=False
              for term in terms:
                  positions=[m.start() for m in re.finditer(re.escape(term),text)]
                  if positions:
                      found=True
                      print('TERM',term,'count',len(positions),'positions',positions[:20])
                      for pos in positions[:5]:
                          ctx=text[max(0,pos-2000):pos+2600]
                          ctx=re.sub(r'\s+',' ',ctx)
                          print('CTX',term,pos,ctx[:4400])
              if not found:
                  print('NO_TERMS_FOUND')
              print('\n## DISPATCH_CONTEXTS')
              for m in re.finditer(r'type:"RELEASEDINDEX/[^"]+"',text):
                  pos=m.start(); ctx=text[max(0,pos-2200):pos+3000]
                  print('DISPATCH_AT',pos,re.sub(r'\s+',' ',ctx)[:5000])
              print('\n## OBJECT_KEYS_NEAR_PAYLOAD')
              for term in ['detailStocks','detailAnnounce','detailTrend','detailTimelines']:
                  for mm in re.finditer(re.escape(term),text):
                      pos=mm.start(); ctx=text[max(0,pos-3200):pos+4500]
                      print('PAYLOAD_CTX_FOR',term,pos,re.sub(r'\s+',' ',ctx)[:7000])
                      break
          PY
          echo "Chunk trace complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
