name: Update Daily Snapshot

on:
  schedule:
    - cron: "17,47 10-13 * * 1-5"
    - cron: "17 14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot.py --target-date "${{ inputs.target_date }}" --force
          else
            python scripts/update_daily_snapshot.py
          fi

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
