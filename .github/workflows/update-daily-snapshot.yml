name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Trace SW component service callers
        run: |
          python - <<'PY'
          import re, requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.swsresearch.com/','Accept':'text/html,application/json,text/plain,*/*'})
          js_url='https://www.swsresearch.com/institute_sw/umi.js'
          r=S.get(js_url,timeout=40,verify=False)
          t=r.text
          print('UMI status',r.status_code,'len',len(t))

          mod_re=re.compile(r'(?P<id>[A-Za-z0-9+/]+):function\(e,t,n\)\{')
          mods=[]
          for m in mod_re.finditer(t):
              mods.append((m.group('id'),m.start(),m.end()))
          intervals=[]
          for i,(mid,start,end) in enumerate(mods):
              stop=mods[i+1][1] if i+1<len(mods) else len(t)
              intervals.append((mid,start,stop,t[start:stop]))
          print('MODULE_COUNT',len(intervals))

          service=None
          for mid,start,stop,body in intervals:
              if '/api/index_publish/details/component_stocks/' in body:
                  service=(mid,start,stop,body)
                  break
          if not service:
              print('SERVICE_MODULE_NOT_FOUND')
              raise SystemExit(1)
          mid,start,stop,body=service
          print('\n## SERVICE MODULE')
          print('SERVICE_ID',mid,'start',start,'stop',stop,'len',len(body))
          print('SERVICE_HEAD',re.sub(r'\s+',' ',body[:3500]))

          export_map=re.findall(r'n\.d\(t,"([^"]+)",\(function\(\)\{return ([A-Za-z_$][\w$]*)\}\)\)',body)
          print('\n## EXPORT MAP')
          for alias,local in export_map:
              print('EXPORT',alias,'=>',local)

          endpoint_hits=[]
          for m in re.finditer(r'Object\([^\)]*\)\("(/api/index_publish/[^"]+)"\s*,\s*t\)',body):
              ep=m.group(1); pos=m.start()
              ctx=body[max(0,pos-1200):pos+900]
              ctx_comp=re.sub(r'\s+',' ',ctx)
              endpoint_hits.append((ep,pos,ctx_comp))
              print('\nENDPOINT_HIT',ep,'pos',pos)
              print(ctx_comp[:2200])

          comp_locals=set()
          comp_pos=body.find('/api/index_publish/details/component_stocks/')
          ctx=body[max(0,comp_pos-1500):comp_pos+1500]
          for wrapper,inner in re.findall(r'function ([A-Za-z_$][\w$]*)\(e\)\{return ([A-Za-z_$][\w$]*)\.apply\(this,arguments\)\}',ctx):
              comp_locals.add(wrapper)
          for fn in re.findall(r'function ([A-Za-z_$][\w$]*)\(\)\{return [A-Za-z_$][\w$]*=Object',ctx):
              comp_locals.add(fn)
          print('\n## COMPONENT LOCAL CANDIDATES',sorted(comp_locals))
          comp_aliases=[alias for alias,local in export_map if local in comp_locals]
          print('## COMPONENT EXPORT ALIASES',comp_aliases)

          print('\n## IMPORTERS AND CALL SITES')
          if not comp_aliases:
              print('NO_COMPONENT_ALIAS_FOUND')
          for imid,istart,istop,ibody in intervals:
              if imid==mid:
                  continue
              if ('n("'+mid+'")' not in ibody) and ("n('"+mid+"')" not in ibody) and (mid not in ibody[:5000]):
                  continue
              found=False
              for alias in comp_aliases:
                  patterns=[r'\["'+re.escape(alias)+r'"\]', r'\.'+re.escape(alias)+r'\b']
                  for pat in patterns:
                      for m in re.finditer(pat,ibody):
                          if not found:
                              print('\nIMPORTER_MODULE',imid,'start',istart,'len',len(ibody))
                              imports=re.findall(r'([A-Za-z_$][\w$]*)\s*=\s*n\("'+re.escape(mid)+r'"\)',ibody)
                              print('IMPORT_VARS',imports)
                              found=True
                          pos=m.start()
                          ctx=ibody[max(0,pos-2200):pos+2600]
                          ctx=re.sub(r'\s+',' ',ctx)
                          print('CALL_ALIAS',alias,'pos',pos)
                          print(ctx[:4500])
                          break
                  if found:
                      break

          print('\n## ROUTE/DETAIL CONTEXTS')
          for term in ['component_stocks','sw_index','timelines','index_spread','currentTab','params','location','query','search','pathname','indexCode','index_code','id:','indexid','indexId']:
              positions=[m.start() for m in re.finditer(re.escape(term),t)]
              if positions:
                  print('TERM',term,'count',len(positions),'first_positions',positions[:10])
                  for pos in positions[:2]:
                      ctx=t[max(0,pos-900):pos+1200]
                      print('TERM_CTX',term,pos,re.sub(r'\s+',' ',ctx)[:2000])
          PY
          echo "Trace callers complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
