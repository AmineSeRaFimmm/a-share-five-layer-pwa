name: Update Daily Snapshot

on:
  schedule:
    # GitHub cron uses UTC. These runs map to Beijing time 19:20, 20:20, 21:20, 22:20.
    # The first run starts after the script's 19:00 after-close cutoff; later runs catch delayed data sources.
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose SW component raw response
        run: |
          python - <<'PY'
          import json, requests, pandas as pd, urllib3
          import akshare as ak
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          print('akshare version:', getattr(ak, '__version__', '<none>'))
          print('has index_stock_cons_sw:', hasattr(ak, 'index_stock_cons_sw'))
          print('has index_component_sw:', hasattr(ak, 'index_component_sw'))
          url = 'https://www.swsresearch.com/institute-sw/api/index_publish/details/component_stocks/'
          headers = {'User-Agent': 'Mozilla/5.0', 'Referer': 'https://www.swsresearch.com/', 'Accept': 'application/json,text/plain,*/*'}
          for code in ['801010', '801030', '801080', '801150', '801780']:
              print('=' * 80)
              print('swindexcode:', code)
              try:
                  r = requests.get(url, params={'swindexcode': code, 'page': '1', 'page_size': '10000'}, headers=headers, timeout=20, verify=False)
                  print('status:', r.status_code)
                  print('content-type:', r.headers.get('content-type'))
                  print('text head:', r.text[:500])
                  data = r.json()
                  inner = data.get('data') if isinstance(data, dict) else None
                  results = inner.get('results') if isinstance(inner, dict) else None
                  print('data keys:', list(inner.keys()) if isinstance(inner, dict) else None)
                  print('results len:', len(results) if hasattr(results, '__len__') else None)
                  if results:
                      df = pd.DataFrame(results)
                      print('RAW COLUMNS:', list(df.columns))
                      print('FIRST ROW:', json.dumps(results[0], ensure_ascii=False)[:1200])
                  else:
                      print('RAW COLUMNS: <NO RESULTS>')
              except Exception as e:
                  print('ERROR:', type(e).__name__, repr(e))
          for code in ['801010', '801030']:
              print('=' * 80)
              print('ak.index_component_sw:', code)
              try:
                  df = ak.index_component_sw(symbol=code)
                  print('rows:', len(df))
                  print('columns:', list(df.columns))
              except Exception as e:
                  print('AKSHARE ERROR:', type(e).__name__, repr(e))
          PY
          echo "Diagnostic complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
