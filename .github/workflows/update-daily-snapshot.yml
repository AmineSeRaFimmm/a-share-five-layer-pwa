name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe SW componentStockPageList endpoints
        run: |
          python - <<'PY'
          import json, requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.swsresearch.com/institute_sw/allIndex/releasedIndex/releasedetail?name=%E5%86%9C%E6%9E%97%E7%89%A7%E6%B8%94&code=801010','Accept':'application/json,text/plain,*/*','Content-Type':'application/json;charset=UTF-8'})
          bases=['https://www.swsresearch.com','https://www.swsresearch.com/institute-sw']
          actions=['componentStockPageList','componentDLFGPageList']
          payloads={
            'componentStockPageList': {'indexCode':'801010','pageNo':1,'pageSize':10},
            'componentDLFGPageList': {'swIndexCode':'801010','pageNo':1,'pageSize':10,'indexType':2},
          }
          paths=[]
          for action in actions:
              paths.extend([
                f'/insWechatSw/swIndex/{action}',
                f'/api/insWechatSw/swIndex/{action}',
                f'/api/index_publish/details/{action}/',
                f'/index_publish/details/{action}/',
              ])
          methods=['GET','POST_JSON','POST_FORM']
          print('## ENDPOINT PROBE')
          for base in bases:
              for path in paths:
                  action=path.rstrip('/').split('/')[-1]
                  data=payloads.get(action, {'indexCode':'801010','pageNo':1,'pageSize':10})
                  for method in methods:
                      url=base+path
                      try:
                          if method=='GET':
                              r=S.get(url,params=data,timeout=25,verify=False)
                          elif method=='POST_JSON':
                              r=S.post(url,json=data,timeout=25,verify=False)
                          else:
                              r=S.post(url,data=data,headers={**S.headers,'Content-Type':'application/x-www-form-urlencoded'},timeout=25,verify=False)
                          txt=r.text[:600].replace('\n',' ')
                          is_json='application/json' in str(r.headers.get('content-type','')).lower() or txt.strip().startswith('{')
                          count=None; keys=None; sample=None
                          if is_json:
                              try:
                                  j=r.json(); keys=list(j.keys()) if isinstance(j,dict) else None
                                  d=j.get('data') if isinstance(j,dict) else None
                                  if isinstance(d,dict):
                                      count=d.get('total') or d.get('count') or d.get('totalAccount') or d.get('totalElements')
                                      arr=d.get('list') or d.get('results') or d.get('records') or d.get('data')
                                      if isinstance(arr,list) and arr:
                                          sample=json.dumps(arr[0],ensure_ascii=False)[:900]
                                  elif isinstance(d,list) and d:
                                      count=len(d); sample=json.dumps(d[0],ensure_ascii=False)[:900]
                              except Exception as e:
                                  sample='JSON_PARSE_ERROR '+repr(e)
                          if r.status_code != 404 and (r.status_code != 200 or is_json or sample or 'component' in txt or 'stock' in txt or 'message' in txt):
                              print('\nCASE',method,url)
                              print('PAYLOAD',data)
                              print('STATUS',r.status_code,'CTYPE',r.headers.get('content-type'),'LEN',len(r.text))
                              print('HEAD',txt)
                              print('JSON_KEYS',keys,'COUNT',count,'SAMPLE',sample)
                      except Exception as e:
                          print('\nERROR',method,url,type(e).__name__,repr(e))
          PY
          echo "Endpoint probe complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
