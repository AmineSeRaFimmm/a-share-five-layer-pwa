name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch hashed SW release detail chunks
        run: |
          python - <<'PY'
          import re, requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.swsresearch.com/','Accept':'text/html,application/javascript,text/plain,*/*'})
          base='https://www.swsresearch.com/institute_sw/'
          umi=S.get(base+'umi.js',timeout=40,verify=False).text
          print('UMI_LEN',len(umi))

          pos=umi.find('function o(e){return')
          print('LOADER_POS',pos)
          if pos >= 0:
              print('LOADER_CTX',re.sub(r'\s+',' ',umi[pos:pos+7000])[:7000])

          maps=[]
          if pos >= 0:
              s=umi[pos:pos+12000]
              for raw in re.findall(r'\{\d+:"[^"]+"(?:,\d+:"[^"]+")*\}',s):
                  d={int(k):v for k,v in re.findall(r'(\d+):"([^"]+)"',raw)}
                  maps.append(d)
          print('MAP_COUNT',len(maps))
          for i,d in enumerate(maps[:4]):
              print('MAP',i,'size',len(d),'sample',list(sorted(d.items()))[:5])

          name_map=maps[0] if maps else {}
          hash_map={}
          for d in maps[1:]:
              if d and all(re.fullmatch(r'[0-9a-f]{6,32}',v) for v in list(d.values())[:10]):
                  hash_map=d; break
          print('NAME_MAP_SIZE',len(name_map),'HASH_MAP_SIZE',len(hash_map))

          target_ids=[5,6,17,18,19,20,21,56]
          targets=[]
          for k in target_ids:
              name=name_map.get(k)
              h=hash_map.get(k)
              if name:
                  urls=[]
                  if h:
                      urls.append(base+name+'.'+h+'.async.js')
                  urls.extend([base+name+'.async.js', base+name+'.js'])
                  targets.append((k,name,h,urls))
          for k,name,h,urls in targets:
              print('\n## TARGET',k,name,'hash',h)
              text=None; got=None
              for url in urls:
                  try:
                      r=S.get(url,timeout=40,verify=False)
                      print('TRY',url,'status',r.status_code,'len',len(r.text),'ctype',r.headers.get('content-type'),'head',r.text[:80].replace('\n',' '))
                      if r.status_code==200 and 'javascript' in str(r.headers.get('content-type','')).lower() and len(r.text)>1000:
                          text=r.text; got=url; break
                  except Exception as e:
                      print('TRY_ERROR',url,type(e).__name__,repr(e))
              if not text:
                  print('NO_REAL_JS_FOR_TARGET')
                  continue
              print('GOT_JS',got,'LEN',len(text))
              terms=['detailStocks','RELEASEDINDEX/detailStocks','component_stocks','swindexcode','indexCode','index_code','indexid','indexId','payload','dispatch','page_size','pageSize','detailAnnounce','detailTrend','detailTimelines','swIndexCode']
              for term in terms:
                  positions=[m.start() for m in re.finditer(re.escape(term),text)]
                  if positions:
                      print('TERM',term,'count',len(positions),'positions',positions[:20])
                      for p in positions[:4]:
                          ctx=text[max(0,p-2200):p+3000]
                          print('CTX',term,p,re.sub(r'\s+',' ',ctx)[:5000])
              print('\n## DISPATCHES')
              for mm in re.finditer(r'type:"RELEASEDINDEX/[^"]+"',text):
                  p=mm.start(); ctx=text[max(0,p-2600):p+3600]
                  print('DISPATCH_AT',p,re.sub(r'\s+',' ',ctx)[:6000])
          PY
          echo "Hashed chunk trace complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
