name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retry fallback SW service mapping trace
        run: |
          python - <<'PY'
          import re, time, requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/javascript,text/plain,*/*','Referer':'https://www.swsresearch.com/institute_sw/'})
          def fetch(url):
              for i in range(1,5):
                  try:
                      r=S.get(url,timeout=(10,80),verify=False)
                      print('FETCH',url,'try',i,'status',r.status_code,'len',len(r.text),'ctype',r.headers.get('content-type'))
                      if r.status_code==200 and len(r.text)>1000:
                          return r.text
                  except Exception as e:
                      print('FETCH_ERROR',url,'try',i,type(e).__name__,repr(e))
                      time.sleep(i*2)
              return ''
          umi=fetch('https://www.swsresearch.com/institute_sw/umi.js')
          chunk=fetch('https://www.swsresearch.com/institute_sw/p__allIndex__releasedIndex__releaseDetail__index.js')
          print('UMI_OK',bool(umi),'CHUNK_OK',bool(chunk))
          print('\n## CHUNK CONFIRMED PAGE PAYLOAD')
          for term in ['componentStockPageList','componentStockPageListexportExc','downLoadDetail','spreadNum','detailAnnounce']:
              if chunk:
                  positions=[m.start() for m in re.finditer(re.escape(term),chunk)]
                  print('CHUNK_TERM',term,'COUNT',len(positions),'POS',positions[:10])
                  for pos in positions[:2]:
                      print(re.sub(r'\s+',' ',chunk[max(0,pos-1000):pos+1800])[:2600])
          if umi:
              module_marks=[(m.group(1),m.start()) for m in re.finditer(r'([A-Za-z0-9+/]+):function\(e,t,n\)\{',umi)]
              modules=[]
              for idx,(mid,start) in enumerate(module_marks):
                  stop=module_marks[idx+1][1] if idx+1<len(module_marks) else len(umi)
                  modules.append((mid,umi[start:stop]))
              service=''; model=''
              for mid,body in modules:
                  if '/api/index_publish/details/component_stocks/' in body or '/insWechatSw/swIndex/' in body:
                      if '/api/index_publish/details/component_stocks/' in body:
                          print('SERVICE_MODULE_CANDIDATE',mid,'LEN',len(body))
                          service=body
                  if 'namespace:"RELEASEDINDEX"' in body:
                      print('MODEL_MODULE',mid,'LEN',len(body))
                      model=body
              print('\n## MODEL ACTION CONTEXTS')
              for action in ['componentStockPageList','componentStockPageListexportExc','downLoadDetail','spreadNum','detailAnnounce']:
                  pos=model.find(action)
                  print('MODEL_ACTION',action,'POS',pos)
                  if pos>=0:
                      print(re.sub(r'\s+',' ',model[max(0,pos-800):pos+2200])[:3000])
              print('\n## SERVICE ENDPOINT CONTEXTS')
              for term in ['/insWechatSw/swIndex/','componentStock','PageList','component_stocks','downLoadDetail']:
                  positions=[m.start() for m in re.finditer(re.escape(term),service)]
                  print('SERVICE_TERM',term,'COUNT',len(positions),'POS',positions[:20])
                  for pos in positions[:5]:
                      print(re.sub(r'\s+',' ',service[max(0,pos-1100):pos+1600])[:2600])
              print('\n## SERVICE_HEAD_14000')
              print(re.sub(r'\s+',' ',service[:14000])[:14000])
          PY
          echo "Retry fallback trace complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
