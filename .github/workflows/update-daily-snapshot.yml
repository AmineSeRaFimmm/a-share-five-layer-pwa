name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Search SW component stock table payloads
        run: |
          python - <<'PY'
          import re, requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.swsresearch.com/','Accept':'text/html,application/javascript,text/plain,*/*'})
          base='https://www.swsresearch.com/institute_sw/'
          umi=S.get(base+'umi.js',timeout=40,verify=False).text
          loader=umi[umi.find('function o(e){return'):umi.find('function o(e){return')+12000]
          maps=[]
          for raw in re.findall(r'\{\d+:"[^"]+"(?:,\d+:"[^"]+")*\}',loader):
              maps.append({int(k):v for k,v in re.findall(r'(\d+):"([^"]+)"',raw)})
          name_map=maps[0] if maps else {}
          target_ids=[17,20,21,5,6,56]
          terms=['componentStockPageList','componentStockPageListexportExc','componentDLFGPageList','componentDLFGPageListexportExc','monthEndComponentWeight','stockcode','stockname','newweight','beginningdate','declaredate','swindexcode','swIndexCode','indexCode','page_size','totalAccount','RELEASEDINDEX/detailStocks','detailStocks','/api/index_publish/details/component_stocks/']
          for k in target_ids:
              name=name_map.get(k)
              if not name:
                  continue
              print('\n## TARGET',k,name)
              text=None; got=None
              for url in [base+name+'.js', base+name+'.async.js']:
                  r=S.get(url,timeout=40,verify=False)
                  print('TRY',url,'status',r.status_code,'len',len(r.text),'ctype',r.headers.get('content-type'),'head',r.text[:80].replace('\n',' '))
                  if r.status_code==200 and 'javascript' in str(r.headers.get('content-type','')).lower() and len(r.text)>1000:
                      text=r.text; got=url; break
              if not text:
                  print('NO_REAL_JS')
                  continue
              print('GOT_JS',got,'LEN',len(text))
              for term in terms:
                  positions=[m.start() for m in re.finditer(re.escape(term),text)]
                  if positions:
                      print('\nTERM',term,'count',len(positions),'positions',positions[:30])
                      for p in positions[:6]:
                          ctx=text[max(0,p-3500):p+5000]
                          print('CTX',term,p,re.sub(r'\s+',' ',ctx)[:8000])
              print('\n## RELEASEDINDEX DISPATCHES WITH COMPONENT/STOCK/SWINDEX')
              for m in re.finditer(r'type:"RELEASEDINDEX/[^"]+"',text):
                  p=m.start(); ctx=text[max(0,p-2500):p+3500]; compact=re.sub(r'\s+',' ',ctx)
                  if any(x in compact for x in ['component','Component','Stock','stock','swindexcode','swIndexCode','indexCode','page_size']):
                      print('DISPATCH_AT',p,compact[:6000])
              print('\n## TABLE CANDIDATES')
              for m in re.finditer(r'totalAccount|pageChange|changeTable|columns:',text):
                  p=m.start(); ctx=text[max(0,p-2600):p+3400]; compact=re.sub(r'\s+',' ',ctx)
                  if any(x in compact for x in ['stockcode','stockname','newweight','beginningdate','swindexcode','indexCode','RELEASEDINDEX']):
                      print('TABLE_CTX_AT',p,compact[:6000])
          PY
          echo "Component table payload search complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
