name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Trace SW componentStockPageList service mapping
        run: |
          python - <<'PY'
          import re
          import requests
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          text = requests.get('https://www.swsresearch.com/institute_sw/umi.js', timeout=40, verify=False, headers={'User-Agent':'Mozilla/5.0'}).text
          print('UMI_LEN', len(text))
          module_marks = [(m.group(1), m.start()) for m in re.finditer(r'([A-Za-z0-9+/]+):function\(e,t,n\)\{', text)]
          modules = []
          for i, item in enumerate(module_marks):
              module_id, start = item
              stop = module_marks[i+1][1] if i + 1 < len(module_marks) else len(text)
              body = text[start:stop]
              modules.append((module_id, body))
          service_body = ''
          model_body = ''
          for module_id, body in modules:
              if '/api/index_publish/details/component_stocks/' in body:
                  print('SERVICE_MODULE', module_id, 'LEN', len(body))
                  service_body = body
              if 'namespace:"RELEASEDINDEX"' in body:
                  print('MODEL_MODULE', module_id, 'LEN', len(body))
                  model_body = body
          print('\n## MODEL ACTIONS')
          for action in ['componentStockPageList','componentDLFGPageList','componentStockPageListexportExc','componentDLFGPageListexportExc','announcementPageList','broadDetails']:
              pos = model_body.find(action)
              print('ACTION', action, 'POS', pos)
              if pos >= 0:
                  ctx = re.sub(r'\s+', ' ', model_body[max(0, pos-700):pos+1800])
                  print(ctx[:2500])
          print('\n## SERVICE CONTEXTS')
          for term in ['componentStockPageList','componentDLFGPageList','component_stocks','component','PageList','swIndex','index']:
              positions = [m.start() for m in re.finditer(re.escape(term), service_body)]
              print('TERM', term, 'COUNT', len(positions), 'POSITIONS', positions[:20])
              for pos in positions[:3]:
                  ctx = re.sub(r'\s+', ' ', service_body[max(0, pos-1000):pos+1800])
                  print('CTX', term, pos, ctx[:2500])
          print('\n## SERVICE EXPORT HEAD')
          print(re.sub(r'\s+', ' ', service_body[:9000])[:9000])
          PY
          echo "Service mapping trace complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
