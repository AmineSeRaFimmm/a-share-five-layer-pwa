name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe SW component sources
        run: |
          python - <<'PY'
          import json, re, requests, urllib3
          from urllib.parse import urljoin
          import pandas as pd
          import akshare as ak
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S = requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.swsresearch.com/','Accept':'application/json,text/plain,*/*'})
          print('akshare version:', getattr(ak, '__version__', '<none>'))
          print('has index_stock_cons_sw:', hasattr(ak, 'index_stock_cons_sw'))
          print('has index_component_sw:', hasattr(ak, 'index_component_sw'))
          print('\n## FRONTEND ASSET SEARCH')
          pages = ['https://www.swsresearch.com/institute_sw/home','https://www.swsresearch.com/institute_sw/index_publish','https://www.swsresearch.com/institute_sw/index_publish/details']
          js_urls = []
          for p in pages:
              try:
                  r=S.get(p,timeout=20,verify=False)
                  print('PAGE',p,'status',r.status_code,'len',len(r.text))
                  for m in re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|css)(?:\?[^"\']*)?)["\']', r.text):
                      u=urljoin(p,m)
                      if u not in js_urls:
                          js_urls.append(u)
              except Exception as e:
                  print('PAGE ERROR',p,type(e).__name__,repr(e))
          print('asset count:',len(js_urls))
          terms=['component_stocks','swindexcode','成分股','index_publish/details','stockcode','newweight']
          for u in js_urls[:30]:
              try:
                  t=S.get(u,timeout=20,verify=False).text
                  hits=[]
                  for term in terms:
                      pos=t.find(term)
                      if pos>=0:
                          hits.append(term)
                  if hits:
                      print('\nASSET HIT',u,'terms',hits,'len',len(t))
                      for term in hits:
                          pos=t.find(term)
                          print('CTX',term, t[max(0,pos-250):pos+350].replace('\n',' ')[:900])
              except Exception as e:
                  print('ASSET ERROR',u,type(e).__name__,repr(e))
          print('\n## PARAM PROBE')
          base='https://www.swsresearch.com/institute-sw/api/index_publish/details/component_stocks/'
          vals=['801010','801010.SI','sw801010','801010.SL']
          names=['swindexcode','swIndexCode','indexcode','indexCode','index_code','swindex_code','code','symbol','secucode','stockcode']
          for name in names:
              for val in vals:
                  params={name:val,'page':'1','page_size':'3'}
                  try:
                      r=S.get(base,params=params,timeout=20,verify=False)
                      txt=r.text[:180]
                      try:
                          j=r.json(); data=j.get('data') if isinstance(j,dict) else None; res=data.get('results') if isinstance(data,dict) else None; n=len(res) if hasattr(res,'__len__') else None
                      except Exception:
                          n=None
                      if n not in (0,None) or name in ['swindexcode','indexcode','indexCode','code']:
                          print('TEST',params,'status',r.status_code,'results_len',n,'head',txt)
                          if n:
                              df=pd.DataFrame(res); print('COLUMNS',list(df.columns)); print('ROW',json.dumps(res[0],ensure_ascii=False)[:1000])
                  except Exception as e:
                      print('TEST ERROR',params,type(e).__name__,repr(e))
          print('\n## NEARBY API PROBE')
          paths=['/institute-sw/api/index_publish/details/','/institute-sw/api/index_publish/details/index_info/','/institute-sw/api/index_publish/details/basic_info/','/institute-sw/api/index_publish/details/component_stocks/','/institute-sw/api/index_publish/details/weight_stocks/']
          for path in paths:
              url=urljoin('https://www.swsresearch.com',path)
              try:
                  r=S.get(url,params={'swindexcode':'801010','page':'1','page_size':'3'},timeout=20,verify=False)
                  print('PATH',path,'status',r.status_code,'ctype',r.headers.get('content-type'),'head',r.text[:250])
              except Exception as e:
                  print('PATH ERROR',path,type(e).__name__,repr(e))
          PY
          echo "Probe complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
