name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate SW component filtering
        run: |
          python - <<'PY'
          import json, requests, urllib3
          import pandas as pd
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S = requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.swsresearch.com/','Accept':'application/json,text/plain,*/*'})
          base='https://www.swsresearch.com/institute-sw/api/index_publish/details/component_stocks/'
          industries={'801010':'农林牧渔','801030':'基础化工','801080':'电子','801180':'房地产','801780':'银行'}
          param_names=['swindexcode','swIndexCode','indexcode','indexCode','index_code','code','symbol']
          print('## FILTER VALIDATION')
          def fetch(params):
              r=S.get(base,params=params,timeout=20,verify=False)
              j=r.json()
              d=j.get('data') if isinstance(j,dict) else None
              res=d.get('results') if isinstance(d,dict) else None
              count=d.get('count') if isinstance(d,dict) else None
              rows=[] if not res else res
              codes=[str(x.get('stockcode')) for x in rows[:20] if isinstance(x,dict)]
              names=[str(x.get('stockname')) for x in rows[:20] if isinstance(x,dict)]
              return r.url, count, len(rows), codes, names, rows[:3]
          print('\n## NO FILTER BASELINE')
          try:
              url,count,n,codes,names,rows=fetch({'page':'1','page_size':'20'})
              print('NO_PARAM_URL',url)
              print('NO_PARAM_COUNT',count,'PAGE_ROWS',n)
              print('NO_PARAM_CODES',codes)
              print('NO_PARAM_NAMES',names)
          except Exception as e:
              print('NO_PARAM_ERROR',type(e).__name__,repr(e))
          for pname in param_names:
              print('\n## PARAM',pname)
              sigs=[]
              for code,label in industries.items():
                  try:
                      url,count,n,codes,names,rows=fetch({pname:code,'page':'1','page_size':'20'})
                      sig='|'.join(codes[:10])
                      sigs.append(sig)
                      print('CASE',pname,code,label)
                      print('URL',url)
                      print('COUNT',count,'PAGE_ROWS',n)
                      print('CODES',codes[:10])
                      print('NAMES',names[:10])
                      if rows:
                          print('FIRST_ROW',json.dumps(rows[0],ensure_ascii=False)[:800])
                  except Exception as e:
                      print('CASE_ERROR',pname,code,label,type(e).__name__,repr(e))
              unique=len(set(sigs))
              print('SUMMARY',pname,'unique_signatures',unique,'of',len(sigs))
              if unique == 1:
                  print('CONCLUSION_FOR_PARAM',pname,': NOT_FILTERING_OR_SAME_PAGE_FOR_ALL_CODES')
              else:
                  print('CONCLUSION_FOR_PARAM',pname,': POSSIBLY_FILTERING')
          PY
          echo "Validation complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
