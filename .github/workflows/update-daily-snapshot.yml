name: Update Daily Snapshot

on:
  schedule:
    - cron: "20 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target trade date, YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Trace SW frontend component parameters
        run: |
          python - <<'PY'
          import re, requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.swsresearch.com/','Accept':'text/html,application/json,text/plain,*/*'})
          js_url='https://www.swsresearch.com/institute_sw/umi.js'
          print('## FETCH UMI')
          r=S.get(js_url,timeout=30,verify=False)
          print('status',r.status_code,'len',len(r.text),'ctype',r.headers.get('content-type'))
          t=r.text
          print('tail',t[-500:])
          print('\n## API STRING LIST')
          endpoints=sorted(set(re.findall(r'["\'](/api/index_publish/[^"\']+?)["\']',t)))
          for ep in endpoints:
              print('API',ep)
          print('endpoint_count',len(endpoints))
          print('\n## COMPONENT_STOCKS CONTEXTS')
          for i,m in enumerate(re.finditer('component_stocks',t)):
              pos=m.start()
              ctx=t[max(0,pos-5000):pos+5000]
              ctx=re.sub(r'\s+',' ',ctx)
              print('COMPONENT_CONTEXT',i,'pos',pos)
              print(ctx[:9000])
          print('\n## DETAILS ROUTE / QUERY CONTEXTS')
          terms=['component_stocks','swindexcode','swIndexCode','指数成分','成分股','indexPublish','index_publish','historyData','selectedRows','changePage']
          for term in terms:
              positions=[m.start() for m in re.finditer(re.escape(term),t)]
              print('TERM',term,'count',len(positions),'positions',positions[:20])
              for pos in positions[:3]:
                  ctx=t[max(0,pos-1200):pos+1600]
                  ctx=re.sub(r'\s+',' ',ctx)
                  print('TERM_CTX',term,pos,ctx[:2500])
          print('\n## SOURCE MAP PROBE')
          m=re.search(r'sourceMappingURL=([^\s]+)',t[-2000:])
          print('sourceMappingURL',m.group(1) if m else None)
          if m:
              sm_url=requests.compat.urljoin(js_url,m.group(1))
              try:
                  rr=S.get(sm_url,timeout=30,verify=False)
                  print('sourcemap status',rr.status_code,'len',len(rr.text),'head',rr.text[:300])
                  for term in ['component_stocks','swindexcode','swIndexCode','成分股']:
                      print('sourcemap term',term,'pos',rr.text.find(term))
              except Exception as e:
                  print('sourcemap error',type(e).__name__,repr(e))
          PY
          echo "Trace complete; stopping before snapshot/update/commit."
          exit 1

      - name: Update snapshot
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_daily_snapshot_production.py --target-date "${{ inputs.target_date }}" --force --skip-avix --skip-backtest
          else
            python scripts/update_daily_snapshot_production.py --force --skip-avix --skip-backtest
          fi

      - name: Upload daily snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshot-diagnostics
          path: |
            data/update_status.json
            data/processed_sw_cache.csv
            data/sw_constituents_mapping.json
          if-no-files-found: ignore

      - name: Build live recommendation ledger
        run: |
          python scripts/update_live_recommendation_history.py

      - name: Generate and promote 300-day full-risk grid
        run: |
          python scripts/generate_fullrisk_grid_300_production.py --promote

      - name: Upload full-risk grid diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullrisk-grid-diagnostics
          path: |
            data/backtest/top1_fullrisk_grid_300_refresh_status.json
            data/backtest/top1_fullrisk_grid_300_metadata.json
          if-no-files-found: ignore

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/update_status.json data/recommendation_state.json data/sw_constituents_mapping.json data/history data/avix data/backtest data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily market snapshot"
            git push
          fi
