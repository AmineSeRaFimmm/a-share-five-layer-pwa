name: Update AVIX Snapshot

on:
  schedule:
    # GitHub cron uses UTC. These runs map to Beijing time 08:40, 09:35, 11:35, 15:10.
    # AVIX is refreshed independently from the after-close review snapshot.
    - cron: "40 0 * * 1-5"
    - cron: "35 1 * * 1-5"
    - cron: "35 3 * * 1-5"
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_signals:
        description: "Refresh AVIX index only; skip S3/S4 signal rebuild"
        required: false
        default: false
        type: boolean

concurrency:
  group: avix-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update AVIX cache
        run: |
          if [ "${{ inputs.skip_signals }}" = "true" ]; then
            python scripts/update_avix_snapshot.py --skip-signals
          else
            python scripts/update_avix_snapshot.py
          fi

      - name: Commit AVIX data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/avix data/avix_300_close_mid.csv data/avix_chain_snapshots.csv data/avix_s3_s4_signals.csv
          if git diff --cached --quiet; then
            echo "No AVIX data changes to commit."
          else
            git commit -m "Update AVIX snapshot"
            git push
          fi
